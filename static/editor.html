<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Segmentation editor</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: flex; flex-direction: column; font: 16px system-ui, sans-serif; background: #20242a; color: white; }
    header { display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; padding: .65rem max(1rem, env(safe-area-inset-right)) .65rem max(1rem, env(safe-area-inset-left)); background: #303740; }
    label { display: inline-flex; align-items: center; gap: .35rem; }
    select, button, input { font: inherit; }
    select, button { min-height: 2.5rem; border: 0; border-radius: .4rem; padding: .35rem .6rem; }
    #class-color { display: inline-block; width: 1.25rem; height: 1.25rem; border: 2px solid white; border-radius: 50%; }
    button { background: #dbeafe; color: #10243e; }
    button:disabled { opacity: .5; }
    input[type="range"] { width: 7rem; }
    #status { margin-left: auto; font-size: .9rem; }
    #viewport { position: relative; flex: 1; overflow: hidden; touch-action: none; overscroll-behavior: none; cursor: grab; }
    #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
    #photo { display: block; }
    #overlay { position: absolute; left: 0; top: 0; pointer-events: none; }
    #hint { position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%); padding: .45rem .75rem; border-radius: .4rem; background: #20242acc; white-space: nowrap; pointer-events: none; font-size: .85rem; }
    @media (max-width: 700px) { #status { width: 100%; margin-left: 0; } #hint { font-size: .7rem; } }
  </style>
</head>
<body>
  <header>
    <label>Class <span id="class-color" aria-hidden="true"></span><select id="class"></select></label>
    <label>Brush <input id="brush" type="range" min="1" max="80" value="16"><output id="brush-size">16 px</output></label>
    <button id="undo" type="button" disabled>Undo</button>
    <button id="save" type="button" disabled>Save mask</button>
    <span id="status" role="status">Loading…</span>
  </header>
  <main id="viewport">
    <div id="world"><img id="photo" alt="Image being segmented"><canvas id="overlay"></canvas></div>
    <div id="hint">Pencil: correct · one finger: move · two fingers: zoom</div>
  </main>
  <script src="/editor.js" defer></script>
</body>
</html>
